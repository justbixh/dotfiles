# ── ~/.tmux.conf ──────────────────────────────────────────────────────────────

# ── prefix: Ctrl+Space (ergonomic alternative to Ctrl+B) ─────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── true colour + italics ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

# ── base index from 1 (matches keyboard layout) ──────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on   # fill gaps when windows are closed

# ── mouse support ─────────────────────────────────────────────────────────────
set -g mouse on

# ── vi mode in copy mode ──────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── splits: | and - (intuitive) ───────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── pane navigation: vim-style ────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── pane resize ───────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── fast config reload ────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── new window in current path ────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"

# ── reduce escape-time (important for vim inside tmux) ────────────────────────
set -sg escape-time 10
set -g focus-events on

# ── status bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1e1e2e fg=#cdd6f4"
set -g status-left  "#[bold fg=#89b4fa]  #S #[nobold fg=#585b70] │ "
set -g status-right "#[fg=#585b70]│ #[fg=#a6e3a1]%d %b #[fg=#89dceb]%H:%M "
set -g status-left-length  30
set -g status-right-length 30

# Active/inactive window styling
setw -g window-status-current-style "fg=#cba6f7 bold"
setw -g window-status-current-format " #I #W "
setw -g window-status-format         " #I #W "

# Active pane border
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
