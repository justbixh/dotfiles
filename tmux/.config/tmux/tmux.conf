# ~/.config/tmux/tmux.conf

# general
set -g default-terminal "screen-256color"   # true colors
set -g mouse on                             # click to select/resize, scroll to view history
set -s set-clipboard on                     # use system clipboard
set -g allow-passthrough on                 # allow OSC 52 from applications inside tmux
set -as terminal-features ',xterm*:clipboard' # force clipboard features for xterm compatibility (e.g. WezTerm)
set -g escape-time 0                        # remove the default ~500ms delay after pressing Esc, so vim/neovim feels instant
set -g focus-events on
set -g repeat-time 1000                     # how long (ms) repeatable (-r) bindings stay active
set -g history-limit 1000000

# indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on                  # keep window numbering sequential

# splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}" # new window in current path

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resize (Holding Shift) (repeatable: prefix H H H H)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r f resize-pane -Z     # zoom
bind e choose-window -Z      # choose window

# misc
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"   # fast config reload

# copy mode (vi-style)
setw -g mode-keys vi
set-window-option -g mode-keys vi

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# unbind -T copy-mode-vi MouseDragEnd1Pane    # prevent auto-exit from copy-mode on mouse-up

# Keybindings: windows
bind -n M-1 select-window -t :1       # Alt-1 (no prefix needed): jump directly to window 1
bind -n M-2 select-window -t :2       # Alt-2: jump directly to window 2
bind -n M-3 select-window -t :3       # Alt-3: jump directly to window 3
bind -n M-4 select-window -t :4       # Alt-4: jump directly to window 4
bind -n M-5 select-window -t :5       # Alt-5: jump directly to window 5
bind -n M-6 select-window -t :6       # Alt-6: jump directly to window 6
bind -n M-7 select-window -t :7       # Alt-7: jump directly to window 7
bind -n M-8 select-window -t :8       # Alt-8: jump directly to window 8
bind -n M-9 select-window -t :9       # Alt-9: jump directly to window 9


# ── status bar 1  ────────────────────────────────────────────────────────────────
# theme: borders
set -g pane-border-lines single             # single, double, heavy, simple, number
set -g pane-border-style "fg=#313244"        # inactive border color
set -g pane-active-border-style "fg=#89b4fa" # active border color
# theme: status bar
set -g status-style "bg=#1e1e2e fg=#cdd6f4"
set -g status-left  ""                                            # nothing on left (windows take up space)
set -g status-right "#[bold fg=#89b4fa]  #S #[nobold fg=#585b70]"  # session name on right
set -g status-left-length  30
set -g status-right-length 30
# theme: window status
setw -g window-status-format         " #I #W "   # inactive window
setw -g window-status-current-format " *#I #W "   # active window
setw -g window-status-current-style "fg=#{?window_zoomed_flag,yellow,#cba6f7},bold" # yellow if zoomed
set -g window-status-bell-style "fg=red,nobold"  # bell/alert turns red

