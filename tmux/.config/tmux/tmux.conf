# ── popups ────────────────────────────────────────────────────────────────
# prefix + ` = cratch zsh shell popup (source: ThePrimeagen)
bind \` display-popup \
  -d "#{pane_current_path}" \
  -w 55% \
  -h 60% \
  -E "zsh"

# prefix + g = lazygit popup (source: ericmckevitt)
bind g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

# prefix + s = session switcher x fzf (overrides tmux's built-in session/window picker)
bind s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

