# ~/.config/tmux/tmux.conf

# ── general ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"       # supports italics, unlike screen-256color
set -as terminal-features ',xterm*:RGB'       # true colors (24-bit) for xterm-compatible terminals like WezTerm
set -g mouse on                               # click to select/resize, scroll to view history
set -s set-clipboard on                       # use system clipboard
set -g allow-passthrough on                   # allow OSC 52 from applications inside tmux
set -as terminal-features ',xterm*:clipboard' # force clipboard features for xterm compatibility (e.g. WezTerm)
set -g escape-time 0                          # remove the default ~500ms delay after pressing Esc, so vim/neovim feels instant
set -g focus-events on
set -g repeat-time 1000                       # how long (ms) repeatable (-r) bindings stay active
set -g history-limit 1000000

# tmux defaults to login shells; this launches zsh as a regular interactive, non-login shell
set -g default-command "${SHELL}"  

# (OPTIONAL) OEL: these two settings help avoid seeing random characters on oel tmux startup
# set -s extended-keys off
# set -sa terminal-overrides ',*:XT@'

# ── indexing ────────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on                    # keep window numbering sequential

# ── prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# ── splits ──────────────────────────────────────────────────────────────────
# bind |  split-window -h -c "#{pane_current_path}"
# bind -  split-window -v -c "#{pane_current_path}"
# bind _  split-window -v -c "#{pane_current_path}"
# bind c  new-window -c "#{pane_current_path}"  # new window in current path

# ── SSH-aware splits ────────────────────────────────────────────────────────
# Reuse the current pane's path; reconnect over SSH when the pane is remote.
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @ssh-split-h-key '|'
set -g @ssh-split-v-key '_'
set -g @ssh-split-w-key 'c'
set -g @ssh-split-keep-cwd 'true'
set -g @ssh-split-keep-remote-cwd 'true'
set -g @ssh-split-strip-cmd 'true'
set -g @ssh-split-fail 'false'

# ── pane navigation ─────────────────────────────────────────────────────────
# vi keys: prefix h/j/k/l (Ctrl+h/j/k/l without prefix comes from vim-tmux-navigator)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── pane resize ─────────────────────────────────────────────────────────────
# hold Shift, repeatable: prefix H H H H
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── windows ─────────────────────────────────────────────────────────────────
# Alt-<n> jumps directly to window n (no prefix needed)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# ── copy mode (vi-style) ────────────────────────────────────────────────────
setw -g mode-keys vi
set-window-option -g mode-keys vi

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
# y is handled by tmux-yank (copies to system clipboard automatically)

# ── misc ────────────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"


# ── plugins manager ────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank' # y in copy-mode copies to system clipboard (auto-detects pbcopy/wl-copy/win32yank/xclip)
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl+h/j/k/l moves seamlessly between tmux panes and Vim/Neovim splits

# ── session persistence ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ── popups: scratch shell ──────────────────────────────────────────────────
# scratch zsh shell (prefix + `) source: ThePrimeagen
# bind \` display-popup \
#   -d "#{pane_current_path}" \
#   -w 70% \
#   -h 60% \
#   -E "zsh"

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '`'
set -g @floax-width '70%'
set -g @floax-height '60%'
set -g @floax-border-color 'magenta'          # magenta, #5c6370
set -g @floax-change-path 'true'

# ── popups: lazygit ─────────────────────────────────────────────────────────
# lazygit popup (prefix + g) source: ericmckevitt
bind g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

# ── session switcher ────────────────────────────────────────────────────────
# session switcher x fzf (prefix + s), overrides tmux's built-in session picker
# bind s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# A session manager with fzf preview, zoxide integration, and quick create/switch. (prefix + s)
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-window-height '55%'
set -g @sessionx-window-width '65%'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-tree-mode 'off'
set -g @sessionx-window-mode 'off'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-ls-command 'eza --tree --level=2 --color=always --icons=always'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-git-branch 'on'

