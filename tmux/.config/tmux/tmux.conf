# ── theme 3 catppuccin ──────────────────────────────────────────────────────
set -g @plugin 'catppuccin/tmux#v2.3.0'   

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none" # remove the status bar background color, so it blends with the terminal background
#set -g @catppuccin_window_status_style "rounded"

# load catppuccin now: the `set -agF` lines below expand its @catppuccin_status_* modules immediately,
# so they would be empty if it only loaded later via tpm
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-right-length 250

# right side status (fully manual & symmetric)
set -g status-right ""
# Battery Pill (Green)
set -g status-right "#[fg=#{@thm_green},bg=default]#[fg=#{@thm_bg},bg=#{@thm_green}]󰁹 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #({ pmset -g batt 2>/dev/null | grep -Eo '[0-9]+%%'; sed 's/$/%%/' /sys/class/power_supply/BAT*/capacity 2>/dev/null; echo AC; } | head -1)#[fg=#{@thm_surface_0},bg=default]"
# CPU Pill (Yellow)
set -ag status-right " #[fg=#{@thm_yellow},bg=default]#[fg=#{@thm_bg},bg=#{@thm_yellow}]󰻠 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{cpu_percentage}#[fg=#{@thm_surface_0},bg=default]"
# RAM Pill (Peach)
set -ag status-right " #[fg=#{@thm_peach},bg=default]#[fg=#{@thm_bg},bg=#{@thm_peach}]󰍛 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{ram_percentage}#[fg=#{@thm_surface_0},bg=default]"
# Date/Time e.g., 09 Nov 02:41 PM
set -ag status-right " #[fg=#{@thm_blue},bg=default]#[fg=#{@thm_bg},bg=#{@thm_blue}]󰃭 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] %d %b %I:%M %p#[fg=#{@thm_surface_0},bg=default]"
# Quote of the day (Mauve)
# set -ag status-right " #[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_bg},bg=#{@thm_mauve}]󰝗 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #($HOME/.config/tmux/scripts/quote.sh)#[fg=#{@thm_surface_0},bg=default]"

# right side status (alignment issue)
# set -g status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_cpu}"
# set -ag status-right "#{E:@catppuccin_status_ram}"
# set -ag status-right "#{E:@catppuccin_status_date_time}"
# # datetime (e.g., 09 Nov 02:41 PM)
# set -g @catppuccin_date_time_text " %d %b %I:%M %p "

set -g @catppuccin_window_text "#W#{?window_zoomed_flag,(󰍉),}"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(󰍉),}"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_connect_separator "no"

set -g window-status-current-style default

# ── tpm: initialize (keep this line at the very bottom of tmux.conf) ────────
run '~/.config/tmux/plugins/tpm/tpm'

# after tpm, which re-runs catppuccin: popups use the terminal colors, not catppuccin's
set -g popup-style "bg=default,fg=default"
