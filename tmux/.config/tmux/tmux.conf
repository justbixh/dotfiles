# ~/.config/tmux/tmux.conf

# ── general ─────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"     # true colors
set -g mouse on                               # click to select/resize, scroll to view history
set -s set-clipboard on                       # use system clipboard
set -g allow-passthrough on                   # allow OSC 52 from applications inside tmux
set -as terminal-features ',xterm*:clipboard' # force clipboard features for xterm compatibility (e.g. WezTerm)
set -g escape-time 0                          # remove the default ~500ms delay after pressing Esc, so vim/neovim feels instant
set -g focus-events on
set -g repeat-time 1000                       # how long (ms) repeatable (-r) bindings stay active
set -g history-limit 1000000

# (OPTIONAL) OEL: unlike macOS Terminal, tmux on Linux often defaults to login shells
# set -g default-command "${SHELL}"  # launches zsh as a regular interactive, non-login shell

# (OPTIONAL) OEL: these two settings help avoid seeing random characters on oel tmux startup
# set -s extended-keys off
# set -sa terminal-overrides ',*:XT@'

# ── indexing ────────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on                    # keep window numbering sequential

# ── prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# ── splits ──────────────────────────────────────────────────────────────────
# bind |  split-window -h -c "#{pane_current_path}"
# bind -  split-window -v -c "#{pane_current_path}"
# bind _  split-window -v -c "#{pane_current_path}"
# bind c  new-window -c "#{pane_current_path}"  # new window in current path

# ── SSH-aware splits ────────────────────────────────────────────────────────
# Reuse the current pane's path; reconnect over SSH when the pane is remote.
set -g @plugin 'pschmitt/tmux-ssh-split'
set -g @ssh-split-h-key '|'
set -g @ssh-split-v-key '_'
set -g @ssh-split-w-key 'c'
set -g @ssh-split-keep-cwd 'true'
set -g @ssh-split-keep-remote-cwd 'true'
set -g @ssh-split-strip-cmd 'true'
set -g @ssh-split-fail 'false'

# ── pane navigation ─────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── pane resize ─────────────────────────────────────────────────────────────
# hold Shift, repeatable: prefix H H H H
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── windows ─────────────────────────────────────────────────────────────────
# Alt-<n> jumps directly to window n (no prefix needed)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# ── copy mode (vi-style) ────────────────────────────────────────────────────
setw -g mode-keys vi
set-window-option -g mode-keys vi

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
# y is handled by tmux-yank (copies to system clipboard automatically)

# ── misc ────────────────────────────────────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── plugins: manager ────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'

# ── plugins: persistent ──────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# ── plugins: clipboard ──────────────────────────────────────────────────────
# y in copy-mode copies to system clipboard (auto-detects pbcopy/wl-copy/win32yank/xclip)
set -g @plugin 'tmux-plugins/tmux-yank'

# ── popups: scratch shell ───────────────────────────────────────────────────
# scratch zsh shell (prefix + `) source: ThePrimeagen
# bind \` display-popup \
#   -d "#{pane_current_path}" \
#   -w 70% \
#   -h 60% \
#   -E "zsh"

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind '`'
set -g @floax-width '70%'
set -g @floax-height '60%'
set -g @floax-border-color 'magenta'          # magenta, #5c6370
set -g @floax-change-path 'true'

# ── popups: lazygit ─────────────────────────────────────────────────────────
# lazygit popup (prefix + g) source: ericmckevitt
bind g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

# ── popups: fzf file and folder pickers ─────────────────────────────────────
# open a folder in a new or existing tmux session (prefix + o)
bind o display-popup -E -w 85% -h 80% "$HOME/.config/fzf/bin/fo"
# open a file in nvim inside a new or existing tmux session (prefix + p)
bind p display-popup -E -w 85% -h 80% "$HOME/.config/fzf/bin/ff"

# ── session switcher ────────────────────────────────────────────────────────
# session switcher via plugin (prefix + s)
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-window-height '55%'
set -g @sessionx-window-width '65%'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-tree-mode 'off'
set -g @sessionx-window-mode 'off'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-git-branch 'on'

# session switcher x fzf (prefix + s), overrides tmux's built-in session picker
# bind s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# ── theme 1 ─────────────────────────────────────────────────────────────────
# borders
set -g pane-border-lines single               # single, double, heavy, simple, number
set -g pane-border-style "fg=#313244"         # inactive border color
set -g pane-active-border-style "fg=#89b4fa"  # active border color
# status bar
set -g status-style "bg=#1e1e2e fg=#cdd6f4"
set -g status-left  "#[bold fg=#89b4fa]  #S #[nobold fg=#585b70]"  # session name on left
set -g status-right ""                        # nothing on right
set -g status-left-length  30
set -g status-right-length 30
# window status
setw -g window-status-format         " #I #W "    # inactive window
setw -g window-status-current-format " *#I #W "   # active window
setw -g window-status-current-style "fg=#{?window_zoomed_flag,yellow,#cba6f7},bold"  # yellow if zoomed
set  -g window-status-bell-style "fg=red,nobold"  # bell/alert turns red

# ── theme 2: codingjerk ───────────────────────────────────────
# https://github.com/codingjerk/dotfiles/blob/main/config/tmux/tmux.conf
# # borders
# set -g pane-border-lines simple
# set -g pane-border-style fg=black,bright
# set -g pane-active-border-style fg=magenta
# # status
# set -g status-style bg=default,fg=black,bright
# set -g status-left ""
# set -g status-right "#[fg=black,bright]#S"
# # window status
# set -g window-status-format "●"
# set -g window-status-current-format "●"
# set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta\#,nobold}"
# set -g window-status-bell-style "fg=red,nobold"

# ── theme 3 catppuccin ──────────────────────────────────────────────────────
set -g @plugin 'catppuccin/tmux#v2.3.0'   

set -g @catppuccin_flavor "mocha"
#set -g @catppuccin_window_status_style "rounded"

set -g status-right-length 100
set -g status-left-length 100

#set -g status-right ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
#set -ag status-right "#{E:@catppuccin_status_session}"

set -g @catppuccin_window_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_default_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_number_position "right"

#set -g @catppuccin_status_modules_right "" 
set -g @catppuccin_status_modules_left "session"

set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"


# ── tpm: initialize (keep this line at the very bottom of tmux.conf) ────────
run '~/.tmux/plugins/tpm/tpm'
