[kubernetes]
disabled = false
detect_files = ['k8s']

[java]
disabled = true
format = "[☕ $version]($style) "
style = "bold red"

[perl]
disabled = true

[cmd_duration]
disabled = false
min_time = 50
format = "took [$duration]($style) "
style = "bold yellow"
#show_milliseconds = true

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✖ "
success_symbol = ""
not_executable_symbol = "⚡"
not_found_symbol = "⚡"
sigint_symbol = "⚡"
signal_symbol = "⚡"
style = "bold red"
map_symbol = true

[battery]
charging_symbol = "⚡"
disabled = false
discharging_symbol = "🪫"
empty_symbol = "🪫"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[memory_usage]
disabled = false
threshold = 80
format = "[🧮 ${ram_pct}]($style) "
style = "bold dimmed green"
