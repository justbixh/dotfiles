# ~/.config/starship.toml

format = """
$username$hostname$localip$directory$git_branch$git_status$cmd_duration$package$memory_usage$status$kubernetes$battery
$character
"""

scan_timeout = 5000
command_timeout = 5000
add_newline = true

[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
#vimcmd_symbol  = "[❮](bold yellow)"
vimcmd_symbol = "[V](bold green) "

[username]
disabled = false
show_always = true
format = "[$user]($style) "
#style_user = "bold cyan"
style_root = "bold red"
#style_root = "bold white bg:red"

[hostname]
disabled = true
ssh_only = false
format = "[$hostname ]($style) "
style = "bold yellow"
#trim_at = "-"

[localip]
disabled = false
ssh_only = true  # only shown over SSH, so your laptop prompt stays clean
format = "[$localipv4]($style) "
style = 'bold yellow'

[directory]
disabled = false
format = "[$path]($style)[$read_only]($read_only_style) "
#style = "bold blue"
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only = " 🔒"

[package]
disabled = false 
format = "[📦 $version]($style) "
style = "white"

[git_branch]
disabled = false
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"
# ignore_branches = ['master', 'main']

