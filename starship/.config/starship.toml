# ~/.config/starship.toml

# ── Prompt layout ────────────────────────────────────────────────
format = """
$username$directory$git_branch$git_status$cmd_duration$package$battery$memory_usage$cmd_duration$status
$character
"""

[character] # prompt symbol
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold yellow)"   # vi mode indicator

[username]
show_always = false
format = "[$user]($style) "
#style_user = "bold cyan"

[hostname]
ssh_only = false
format = "[🌐 $hostname]($style) in "
style = "bold yellow"
trim_at = "-"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
#style = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only = " 🔒"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[package]
disabled = false
format = "[📦 $version]($style) "
style = "bold magenta"

[java] # Java (only language shown)
disabled = false
format = "[☕ $version]($style) "
style = "bold red"

# ── Exit / Status ────────────────────────────────────────────────
[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✖ "
success_symbol = ""
not_executable_meaning = "🚫 "
not_found_symbol = "⚡"
sigint_symbol = "⚡"
signal_symbol = "⚡"
style = "bold red"
map_symbol = true

# ── Battery ──────────────────────────────────────────────────────
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "🪫"
unknown_symbol = "❓"
empty_symbol = "🪫"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# ── Memory ───────────────────────────────────────────────────────
[memory_usage]
disabled = false
threshold = 50
format = "[🧮 ${ram_pct}]($style) "
style = "bold dimmed green"

# ── cmd duration ─────────────────────────────────────────────────
[cmd_duration]
min_time = 50
format = "took [$duration](bold yellow) "
show_milliseconds = true 

