# ~/.config/yazi/yazi.toml

[manager]
ratio          = [1, 2, 4]        # columns: parent / current / preview
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true
linemode       = "size"           # size | mtime | permissions | none

[preview]
tab_size       = 2
max_width      = 1200
max_height     = 900
cache_dir      = ""               # defaults to system cache dir
image_filter   = "triangle"
image_quality  = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0.0, 0.0, 0.0, 0.0]

[opener]
# open in $EDITOR
edit = [
  { run = '$EDITOR "$@"', desc = "Edit", block = true },
]
# open with xdg-open
open = [
  { run = 'xdg-open "$@"', desc = "Open" },
]
# reveal in terminal
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal" },
]

[open]
rules = [
  # text / code → editor
  { mime = "text/*",                    use = ["edit", "reveal"] },
  { mime = "application/json",          use = ["edit", "reveal"] },
  { mime = "application/x-shellscript", use = ["edit", "reveal"] },
  # media → xdg
  { mime = "image/*",  use = ["open", "reveal"] },
  { mime = "video/*",  use = ["open", "reveal"] },
  { mime = "audio/*",  use = ["open", "reveal"] },
  # pdf / office → xdg
  { mime = "application/pdf",           use = ["open", "reveal"] },
  { mime = "application/vnd.*",         use = ["open", "reveal"] },
  # archives
  { mime = "application/zip",           use = ["reveal"] },
  { mime = "application/x-tar",         use = ["reveal"] },
  { mime = "application/x-bzip2",       use = ["reveal"] },
  { mime = "application/x-gzip",        use = ["reveal"] },
  # fallback
  { mime = "*",                         use = ["open", "reveal"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912   # 512 MiB
image_bound      = [0, 0]
suppress_preload = false

[log]
enabled = false