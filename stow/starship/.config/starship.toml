# ── ~/.config/starship.toml ───────────────────────────────────────────────────
# Minimal, informative prompt. Customise freely.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username$hostname$directory$git_branch$git_status$python$java$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold yellow)"   # vi mode indicator

[directory]
truncation_length    = 4
truncate_to_repo     = true
style                = "bold cyan"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
conflicted  = "🔥"
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇡${ahead_count}⇣${behind_count}"
untracked   = "?"
modified    = "!"
staged      = "+"
renamed     = "»"
deleted     = "✘"

[cmd_duration]
min_time           = 2_000   # show if command took > 2s
format             = "took [$duration](bold yellow) "

[hostname]
ssh_only = true              # only show hostname over SSH
style    = "bold green"
format   = "[@$hostname](bold green) "

[username]
show_always = false          # only show when root or SSH
style_root  = "bold red"
format      = "[$user]($style) "

[python]
symbol = " "
format = '[$symbol$version]($style) '

[java]
symbol = " "
format = '[$symbol$version]($style) '
